[workspace]
resolver = "2"
members = [
    "crates/latex_ast",
    "crates/math_preview",
    "crates/mcp_server",
    "crates/texword_app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
csv = "1.3"
regex = "1.11"
uuid = { version = "1.0", features = ["v4"] }

# GPUI + GPUI Component (pinned to gpui-pre =0.3.12 required by gpui-component 0.10.0)
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit", "x11", "wayland"] }
gpui-component = "0.10.0"

# MCP Official Rust SDK
rmcp = { version = "3.10.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = "1.0"
axum = "0.8"
tokio-util = "0.7"
